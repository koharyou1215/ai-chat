<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Debug Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: white;
        }
        .content {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 15px 30px;
            background-color: #3b82f6;
            color: white;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .debug-info {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">AI Chat - Final Debug Test</div>
        
        <div class="content">
            <p>これは完全に静的なHTMLファイルです。</p>
            <p>Next.js、React、TailwindCSSは一切使用されていません。</p>
            <div class="debug-info">
                <p>✓ HTML loaded</p>
                <p>✓ CSS applied</p>
                <p id="js-status">⏳ JavaScript loading...</p>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="testInput" placeholder="テストメッセージを入力">
            <button onclick="testFunction()">送信</button>
        </div>
    </div>

    <script>
        document.getElementById('js-status').textContent = '✓ JavaScript loaded';
        
        function testFunction() {
            const input = document.getElementById('testInput');
            alert('メッセージ: ' + input.value);
            input.value = '';
        }
        
        console.log('Static HTML page loaded successfully');
    </script>
</body>
</html>

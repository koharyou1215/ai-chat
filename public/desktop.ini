[.ShellClassInfo]
IconFile=SetFolderIcon(folderPath, originalImagePath)
{
    ; アイコンのパスを生成 (PowerShellスクリプトと同じロジック)
    icoPath := RegExReplace(originalImagePath, "\.[^\.]+$", ".ico")

    ; desktop.iniファイルへのパス
    iniPath := folderPath . "\desktop.ini"
    
    ; desktop.iniファイルを読み込み
    try {
        iniContent := FileRead(iniPath)
    } catch {
        iniContent := ""
    }
    
    ; IconFile=... の行を正規表現で書き換え
    if (RegExMatch(iniContent, "i)IconFile=(.+)", &match))
    {
        iniContent := RegExReplace(iniContent, "i)IconFile=(.+)", "IconFile=" . icoPath)
    }
    else
    {
        ; IconFile= の行が存在しない場合は追記
        iniContent .= "[.ShellClassInfo]`r`nIconFile=" . icoPath . "`r`n"
    }

    ; ファイルを上書き
    FileAppend(iniContent, iniPath)
    
    ; フォルダの属性を隠しファイル+システムファイルにする
    FileSetAttrib("+H +S", folderPath)
    
    ; フォルダの読み取り専用属性を付与し、再描画を促す
    RunWait("CMD.exe /C """ . "attrib +r """ . folderPath . """",, "Hide")
}
IconIndex=0

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景設定デバッグ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .debug-section {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .debug-output {
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            margin: 10px 0;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #005a9e;
        }
    </style>
</head>
<body>
    <h1>🔍 チャットアプリ背景設定デバッグツール</h1>
    
    <div class="debug-section">
        <h2>1. CSS変数の確認</h2>
        <button onclick="checkCSSVariables()">CSS変数をチェック</button>
        <div id="css-variables" class="debug-output"></div>
    </div>

    <div class="debug-section">
        <h2>2. LocalStorageの確認</h2>
        <button onclick="checkLocalStorage()">LocalStorageをチェック</button>
        <div id="local-storage" class="debug-output"></div>
    </div>

    <div class="debug-section">
        <h2>3. 背景ファイルの確認</h2>
        <button onclick="checkBackgroundFiles()">背景ファイルをチェック</button>
        <div id="background-files" class="debug-output"></div>
    </div>

    <div class="debug-section">
        <h2>4. DOM要素の確認</h2>
        <button onclick="checkDOMElements()">DOM要素をチェック</button>
        <div id="dom-elements" class="debug-output"></div>
    </div>

    <div class="debug-section">
        <h2>5. テスト用背景設定</h2>
        <button onclick="setTestBackground('ocean')">海のテーマを適用</button>
        <button onclick="setTestBackground('sunset')">夕焼けテーマを適用</button>
        <button onclick="setTestBackground('custom')">カスタム背景をテスト</button>
        <button onclick="resetBackground()">背景をリセット</button>
        <div id="test-results" class="debug-output"></div>
    </div>

    <script>
        function log(elementId, message) {
            const element = document.getElementById(elementId);
            element.innerHTML += message + '<br>';
        }

        function clearLog(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }

        function checkCSSVariables() {
            clearLog('css-variables');
            const root = document.documentElement;
            const computedStyle = getComputedStyle(root);
            
            const cssVars = [
                '--theme-background',
                '--theme-background-image',
                '--theme-background-size',
                '--theme-background-position',
                '--theme-sidebar',
                '--theme-text-primary'
            ];
            
            log('css-variables', '=== CSS変数の値 ===');
            cssVars.forEach(varName => {
                const value = computedStyle.getPropertyValue(varName) || '未設定';
                log('css-variables', `${varName}: ${value}`);
            });
        }

        function checkLocalStorage() {
            clearLog('local-storage');
            log('local-storage', '=== LocalStorageの内容 ===');
            
            const keys = [
                'ai-chat-theme',
                'ai-chat-custom-background',
                'ai-chat-settings'
            ];
            
            keys.forEach(key => {
                const value = localStorage.getItem(key);
                if (value) {
                    try {
                        const parsed = JSON.parse(value);
                        log('local-storage', `${key}:`);
                        log('local-storage', JSON.stringify(parsed, null, 2));
                    } catch (e) {
                        log('local-storage', `${key}: ${value}`);
                    }
                } else {
                    log('local-storage', `${key}: 未設定`);
                }
            });
        }

        function checkBackgroundFiles() {
            clearLog('background-files');
            log('background-files', '=== 背景ファイルの確認 ===');
            
            const filesToCheck = [
                '/bg.mp4',
                '/background/bg.mp4',
                '/Background/bg.mp4'
            ];
            
            filesToCheck.forEach(async (file) => {
                try {
                    const response = await fetch(file, { method: 'HEAD' });
                    if (response.ok) {
                        log('background-files', `✅ ${file}: 存在します (${response.status})`);
                    } else {
                        log('background-files', `❌ ${file}: 見つかりません (${response.status})`);
                    }
                } catch (error) {
                    log('background-files', `❌ ${file}: エラー - ${error.message}`);
                }
            });
        }

        function checkDOMElements() {
            clearLog('dom-elements');
            log('dom-elements', '=== DOM要素の確認 ===');
            
            // 背景動画要素
            const videos = document.querySelectorAll('video');
            log('dom-elements', `背景動画要素: ${videos.length}個`);
            videos.forEach((video, index) => {
                log('dom-elements', `  Video ${index + 1}: src=${video.src}, style=${video.style.cssText}`);
            });
            
            // テーマ関連クラス
            const themeElements = document.querySelectorAll('[class*="theme"]');
            log('dom-elements', `テーマ関連要素: ${themeElements.length}個`);
            
            // z-index の確認
            const allElements = document.querySelectorAll('*');
            let zIndexElements = [];
            allElements.forEach(el => {
                const zIndex = getComputedStyle(el).zIndex;
                if (zIndex !== 'auto' && zIndex !== '0') {
                    zIndexElements.push({
                        element: el.tagName + (el.className ? '.' + el.className : ''),
                        zIndex: zIndex
                    });
                }
            });
            
            log('dom-elements', 'z-index設定要素:');
            zIndexElements.forEach(item => {
                log('dom-elements', `  ${item.element}: z-index=${item.zIndex}`);
            });
        }

        function setTestBackground(type) {
            clearLog('test-results');
            log('test-results', `=== ${type}背景のテスト ===`);
            
            const root = document.documentElement;
            
            switch(type) {
                case 'ocean':
                    root.style.setProperty('--theme-background', 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)');
                    root.style.setProperty('--theme-background-image', 'none');
                    document.body.style.background = 'var(--theme-background)';
                    log('test-results', '海のテーマを適用しました');
                    break;
                    
                case 'sunset':
                    root.style.setProperty('--theme-background', 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%)');
                    root.style.setProperty('--theme-background-image', 'none');
                    document.body.style.background = 'var(--theme-background)';
                    log('test-results', '夕焼けテーマを適用しました');
                    break;
                    
                case 'custom':
                    // テスト用のグラデーション背景
                    root.style.setProperty('--theme-background', 'radial-gradient(circle at center, #4a90e2 0%, #1a1a1a 70%)');
                    root.style.setProperty('--theme-background-image', 'none');
                    document.body.style.background = 'var(--theme-background)';
                    log('test-results', 'カスタムテスト背景を適用しました');
                    break;
            }
            
            // LocalStorageに保存
            const testTheme = {
                currentTheme: type,
                customBackground: null,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem('ai-chat-theme', JSON.stringify(testTheme));
            log('test-results', 'LocalStorageに保存しました');
        }

        function resetBackground() {
            clearLog('test-results');
            log('test-results', '=== 背景をリセット ===');
            
            const root = document.documentElement;
            root.style.removeProperty('--theme-background');
            root.style.removeProperty('--theme-background-image');
            document.body.style.background = '#1a1a1a';
            
            localStorage.removeItem('ai-chat-theme');
            log('test-results', '背景をリセットし、LocalStorageをクリアしました');
        }

        // ページ読み込み時に自動実行
        window.addEventListener('load', () => {
            checkCSSVariables();
            checkLocalStorage();
        });
    </script>
</body>
</html>
